<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="proofgate-banner-title">
  <title id="proofgate-banner-title">ProofGate — AI wrote it. Prove it works.</title>
  <defs>
